<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IUB Cloud Lab — exploring cloud computing together.">
  <title>IUB Cloud Lab</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(2rem, 7vw, 4rem);
      background: #fff;
      border: 1px solid #e3eaf3;
      border-radius: 1.25rem;
      box-shadow: 0 1.5rem 4rem rgb(28 49 81 / 8%);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: #2874c8;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #122443;
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .intro {
      margin: 1.25rem 0 2.5rem;
      color: #53627a;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    h2 {
      margin: 0 0 1rem;
      color: #263b5c;
      font-size: 1rem;
    }

    ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 0.9rem 1rem;
      background: #f4f7fb;
      border-radius: 0.65rem;
      color: #33445f;
      font-weight: 550;
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e8edf4;
      color: #78859a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Independent University, Bangladesh</p>
    <h1>IUB Cloud Lab</h1>
    <p class="intro">A space to learn, build, and explore cloud computing together.</p>

    <section aria-labelledby="team-heading">
      <h2 id="team-heading">Our team</h2>
      <ul>
        <li>Tanjim Shahriar</li>
        <li>Md. Zahirul Islam</li>
        <li>Md. Ataur Rahaman</li>
        <li>Mohiul Alam</li>
      </ul>
    </section>

    <footer>Learning and building in the cloud.</footer>
  </main>
</body>
</html>
